name: Validate Hub

on:
  pull_request:
  push:
    branches:
      - main
      - 'sprint-*'
      - 'forge/issue-3-live-gateway-proof'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Governed experiment registry
        run: npm run validate:experiments

      - name: Typecheck and build APWA
        run: npm run build

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Build rigid gateway
        run: dotnet build gateway/Kopano.Sovereign.Gateway/Kopano.Sovereign.Gateway.csproj --configuration Release

      - name: Sovereign runtime governance proof
        env:
          ASPNETCORE_ENVIRONMENT: Production
          YOUTUBE_CHANNEL_HANDLE: '@kopanolabs'
        run: |
          set -euo pipefail
          mkdir -p /tmp/kopano-gateway-proof
          dotnet run --project gateway/Kopano.Sovereign.Gateway/Kopano.Sovereign.Gateway.csproj --configuration Release --no-build --urls http://127.0.0.1:5097 > /tmp/kopano-gateway-proof/gateway.log 2>&1 &
          gateway_pid=$!
          echo "$gateway_pid" > /tmp/kopano-gateway-proof/gateway.pid

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5097/health > /tmp/kopano-gateway-proof/health.json; then
              break
            fi
            sleep 1
          done

          test -s /tmp/kopano-gateway-proof/health.json
          jq -e '.status == "ok" and .credentialRequired == false' /tmp/kopano-gateway-proof/health.json
          jq -e '.adapters | index("kpgs.public-evidence.parse") != null' /tmp/kopano-gateway-proof/health.json
          jq -e '.experimentRegistry.nodes >= 15 and .experimentRegistry.renterAssertion == "I_AM_STATELESS_RENTER_NOT_LANDLORD"' /tmp/kopano-gateway-proof/health.json

          curl --fail --silent --show-error \
            'http://127.0.0.1:5097/api/governance/experiments' \
            > /tmp/kopano-gateway-proof/experiments.json

          jq -e '.receipt.gate == "ALLOW" and .receipt.adapterId == "kpgs.experiment-estate.read"' /tmp/kopano-gateway-proof/experiments.json
          jq -e '.laws.realityIndex == "REALITY_STATE > INDEX_STATE"' /tmp/kopano-gateway-proof/experiments.json
          jq -e '.nodes[] | select(.id == "cape-campass") | .state == "TARGET" and .repo == null' /tmp/kopano-gateway-proof/experiments.json
          jq -e '.nodes[] | select(.id == "starfall-salvage") | .state == "REWORK" and .lifecycle == "PRUNE"' /tmp/kopano-gateway-proof/experiments.json
          jq -e '.nodes[] | select(.id == "harvest-4-all") | .lifecycle == "HARVEST"' /tmp/kopano-gateway-proof/experiments.json

          curl --fail --silent --show-error \
            'http://127.0.0.1:5097/api/public/evidence' \
            > /tmp/kopano-gateway-proof/public-evidence-runtime.json

          jq -e '.receipt.gate == "ALLOW" and .receipt.adapterId == "kpgs.public-evidence.parse"' /tmp/kopano-gateway-proof/public-evidence-runtime.json
          jq -e '.items | length == 3' /tmp/kopano-gateway-proof/public-evidence-runtime.json
          jq -e '.items[] | select(.id == "bookit-fivesarena") | .state == "Live"' /tmp/kopano-gateway-proof/public-evidence-runtime.json
          jq -e '.items[] | select(.id == "freddy-nw-alfalfa") | .state == "In the field"' /tmp/kopano-gateway-proof/public-evidence-runtime.json
          jq -e '.items[] | select(.id == "flow-inc-ink") | .state == "Delivered"' /tmp/kopano-gateway-proof/public-evidence-runtime.json

          jq 'del(.receipt)' /tmp/kopano-gateway-proof/public-evidence-runtime.json > /tmp/kopano-gateway-proof/public-evidence-parsed.json
          jq -S . /tmp/kopano-gateway-proof/public-evidence-parsed.json > /tmp/kopano-gateway-proof/public-evidence-parsed.sorted.json
          jq -S . governance/public-evidence.json > /tmp/kopano-gateway-proof/public-evidence-source.sorted.json
          diff -u /tmp/kopano-gateway-proof/public-evidence-source.sorted.json /tmp/kopano-gateway-proof/public-evidence-parsed.sorted.json

          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --slurpfile health /tmp/kopano-gateway-proof/health.json \
            --slurpfile experiments /tmp/kopano-gateway-proof/experiments.json \
            --slurpfile publicEvidence /tmp/kopano-gateway-proof/public-evidence-runtime.json \
            '{schema:"kopano.gateway.governance-proof.v2",commit:$commit,runId:$run,health:$health[0],experiments:$experiments[0],publicEvidence:$publicEvidence[0],gate:"ALLOW",truthBoundary:"Hard gate proving the .NET gateway exposes governed experiment state and parses it into a smaller user-facing evidence contract."}' \
            > /tmp/kopano-gateway-proof/governance-receipt.json

      - name: External YouTube transport observation
        continue-on-error: true
        run: |
          set -u
          gateway_pid="$(cat /tmp/kopano-gateway-proof/gateway.pid 2>/dev/null || true)"
          http_code="$(curl --silent --show-error \
            -o /tmp/kopano-gateway-proof/uploads.json \
            -w '%{http_code}' \
            -H 'X-Kopano-Request-Id: external-media-observation' \
            'http://127.0.0.1:5097/api/youtube/uploads?limit=1' || true)"

          if [ "$http_code" = "200" ] && \
             jq -e '.receipt.gate == "ALLOW" and .transport == "dotnet-gateway"' /tmp/kopano-gateway-proof/uploads.json >/dev/null 2>&1; then
            external_gate="ALLOW"
          else
            external_gate="REVIEW"
          fi

          jq -n \
            --arg gate "$external_gate" \
            --arg httpCode "$http_code" \
            '{schema:"kopano.gateway.external-observation.v1",adapterId:"youtube.public-media.read",gate:$gate,httpCode:$httpCode,truthBoundary:"External provider availability is observed separately and cannot veto the local KPGS experiment runtime."}' \
            > /tmp/kopano-gateway-proof/external-media-receipt.json

          if [ -n "$gateway_pid" ]; then kill "$gateway_pid" 2>/dev/null || true; fi

      - name: Upload gateway proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sovereign-hub-runtime-proof
          path: /tmp/kopano-gateway-proof/
          if-no-files-found: warn
