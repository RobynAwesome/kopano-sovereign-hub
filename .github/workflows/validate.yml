name: Validate Hub

on:
  pull_request:
  push:
    branches:
      - main
      - 'sprint-*'
      - 'forge/issue-3-live-gateway-proof'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build APWA
        run: npm run build

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'ga'

      - name: Build rigid gateway
        run: dotnet build gateway/Kopano.Sovereign.Gateway/Kopano.Sovereign.Gateway.csproj --configuration Release

      - name: Live upstream governance-transport proof
        env:
          ASPNETCORE_ENVIRONMENT: Production
          YOUTUBE_CHANNEL_HANDLE: '@kopanolabs'
        run: |
          set -euo pipefail
          mkdir -p /tmp/kopano-gateway-proof
          dotnet run --project gateway/Kopano.Sovereign.Gateway/Kopano.Sovereign.Gateway.csproj --configuration Release --no-build --urls http://127.0.0.1:5097 > /tmp/kopano-gateway-proof/gateway.log 2>&1 &
          gateway_pid=$!
          trap 'kill "$gateway_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5097/health > /tmp/kopano-gateway-proof/health.json; then
              break
            fi
            sleep 1
          done

          test -s /tmp/kopano-gateway-proof/health.json
          jq -e '.status == "ok" and .upstreamMode == "youtube-public-feed" and .credentialRequired == false' /tmp/kopano-gateway-proof/health.json

          curl --fail --silent --show-error \
            -H 'X-Kopano-Request-Id: sprint01-live-proof' \
            'http://127.0.0.1:5097/api/youtube/uploads?limit=1' \
            > /tmp/kopano-gateway-proof/uploads.json

          jq -e '.receipt.gate == "ALLOW" and .receipt.outcome == "executed" and .receipt.requestId == "sprint01-live-proof"' /tmp/kopano-gateway-proof/uploads.json
          jq -e '.transport == "dotnet-gateway" and .provider == "YouTube public Atom feed"' /tmp/kopano-gateway-proof/uploads.json
          jq -e '.feed.channelId | startswith("UC")' /tmp/kopano-gateway-proof/uploads.json
          jq -e '.feed.uploads | length >= 1' /tmp/kopano-gateway-proof/uploads.json

          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg run "$GITHUB_RUN_ID" \
            --slurpfile health /tmp/kopano-gateway-proof/health.json \
            --slurpfile uploads /tmp/kopano-gateway-proof/uploads.json \
            '{schema:"kopano.gateway.live-proof.v1",commit:$commit,runId:$run,health:$health[0],response:$uploads[0],truthBoundary:"Ephemeral CI deployment receipt proving live .NET gateway -> YouTube public upstream transport. This is not a long-lived production-host SLA."}' \
            > /tmp/kopano-gateway-proof/receipt.json

      - name: Upload gateway proof receipt
        uses: actions/upload-artifact@v4
        with:
          name: sprint-01-gateway-live-proof
          path: /tmp/kopano-gateway-proof/
          if-no-files-found: error
