name: Validate Hub

on:
  pull_request:
  push:
    branches:
      - main
      - 'sprint-*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build
